data:
  exchange: binance_futures
  cache_dir: data/candles
  default_days: 60

symbols:
  - ETH/USDT
  - SOL/USDT

btc_symbol: BTC/USDT

costs:
  fee_roundtrip_bps: 8
  slippage_roundtrip_bps: 6

risk:
  starting_balance_usd: 1000
  risk_pct_per_trade: 3.0
  max_leverage: 5
  min_net_rr: 1.0

adaptive_target:
  atr_multiplier: 1.4

btc_macro:
  enabled: true
  htf_timeframe: "4h"
  strong_threshold: 70
  bullish:
    buy_multiplier: 1.15
    sell_multiplier: 0.70
  bearish:
    buy_multiplier: 0.50
    sell_multiplier: 1.15

modes:
  scalp:
    primary_timeframe: "5m"
    confirm_timeframes: ["15m", "1h"]
    min_score_to_signal:
      buy: 75
      sell: 75
    min_score_gap: 12
    evaluation_candles: 12
    min_candles_before_invalidation: 2
    success_move_bps: 20
    rr: 1.5
    atr_period: 14
    min_stop_bps: 60
    cooldown_minutes: 10
    max_concurrent_positions: 3
    min_atr_bps: 25
    min_adx: 20
    break_even_trigger_bps: 9999
    trailing:
      enabled: true
      trail_distance_bps: 40
    weights:
      technical: 40
      multi_timeframe: 30
      smc: 30
    smc_weight_cap_if_htf_disagrees: 15

active_modes:
  - scalp

layers:
  smc:
    fractal_left: 5
    fractal_right: 5

walkforward:
  n_windows: 2
  train_frac: 0.6
  search_budget: 15
  min_trades_in_train: 10
  objective: sharpe_daily
  random_seed: 42

parameter_space:
  scalp:
    min_score_gap: {choices: [12, 15, 18]}
    rr: {choices: [1.5, 1.7, 2.0]}
    min_stop_bps: {choices: [50, 60, 70]}
    atr_multiplier: {choices: [1.2, 1.4, 1.8]}

paper:
  poll_interval_seconds: 60
  journal_db: data/paper.db
  dashboard_port: 5000
