data:
  exchange: bybit_linear
  cache_dir: data/candles
  default_days: 60

symbols:
  - ETH/USDT
  - SOL/USDT

btc_symbol: BTC/USDT

costs:
  fee_roundtrip_bps: 8
  slippage_roundtrip_bps: 6

risk:
  starting_balance_usd: 1000
  risk_pct_per_trade: 1.0
  max_leverage: 5
  min_net_rr: 1.0

adaptive_target:
  atr_multiplier: 1.4

btc_macro:
  enabled: true
  htf_timeframe: "4h"
  strong_threshold: 70
  bullish:
    buy_multiplier: 1.15
    sell_multiplier: 0.70
  bearish:
    buy_multiplier: 0.50
    sell_multiplier: 1.15

modes:
  scalp:
    primary_timeframe: "5m"
    confirm_timeframes: ["15m", "1h"]
    # STRICT RULES: Confidence barha diya
    min_score_to_signal:
      buy: 78
      sell: 72
    # STRICT RULES: Gap barha diya taake sirf strong signals aayen
    min_score_gap: 15
    evaluation_candles: 12
    min_candles_before_invalidation: 2
    success_move_bps: 20
    rr: 1.5
    atr_period: 14
    min_stop_bps: 60
    # STRICT RULES: Cooldown 1 ghanta, sirf 1 position
    cooldown_minutes: 60
    max_concurrent_positions: 1
    # NEW: Chop Filter (Agar 5m ATR 40 bps se kam ho to trade na kare)
    min_atr_bps: 40
    # NEW: Break Even (Agar profit 30 bps ho jaye to SL ko Entry+Fee par le aao)
    break_even_trigger_bps: 30
    trailing:
      enabled: true
      trail_distance_bps: 30
    weights:
      technical: 20
      multi_timeframe: 15
      volume_imbalance: 35
      funding: 5
      smc: 25
    smc_weight_cap_if_htf_disagrees: 15

  day:
    primary_timeframe: "15m"
    confirm_timeframes: ["1h", "4h"]
    min_score_to_signal: 68
    min_score_gap: 12
    evaluation_candles: 20
    min_candles_before_invalidation: 2
    success_move_bps: 100
    rr: 1.67
    atr_period: 20
    min_stop_bps: 60
    cooldown_minutes: 90
    max_concurrent_positions: 2
    min_atr_bps: 60
    break_even_trigger_bps: 40
    trailing:
      enabled: true
      trail_distance_bps: 30
    weights:
      technical: 35
      multi_timeframe: 25
      volume_imbalance: 15
      funding: 15
      smc: 10

active_modes:
  - scalp

layers:
  smc:
    fractal_left: 5
    fractal_right: 5
  funding:
    rolling_window: 100
    min_history: 20
  volume_imbalance:
    lookback: 20
    vol_multiplier: 1.5

walkforward:
  n_windows: 2
  train_frac: 0.6
  search_budget: 15
  min_trades_in_train: 10
  objective: sharpe_daily
  random_seed: 42

parameter_space:
  scalp:
    min_score_gap: {choices: [12, 15, 18]}
    rr: {choices: [1.5, 1.7, 2.0]}
    min_stop_bps: {choices: [50, 60, 70]}
    atr_multiplier: {choices: [1.2, 1.4, 1.8]}

paper:
  poll_interval_seconds: 60
  journal_db: data/paper.db
  dashboard_port: 5000
