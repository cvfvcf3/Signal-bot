name: OKX signal logger
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: okx-logger
  cancel-in-progress: false
jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            logger
            e_logs
      - name: Run logger
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python3 logger/okx_logger.py
      - name: Save logs
        run: |
          git config user.name "okx-logger"
          git config user.email "okx-logger@users.noreply.github.com"
          git add e_logs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "logger update"
            git pull --rebase -q
            git push -q
          fi
