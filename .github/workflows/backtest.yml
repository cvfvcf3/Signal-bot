name: Cloud Backtest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode (scalp or day)'
        required: true
        default: 'scalp'
      days:
        description: 'Days to backtest'
        required: true
        default: '60'

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Backtest
        run: python main.py backtest --mode ${{ github.event.inputs.mode }} --days ${{ github.event.inputs.days }}

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: data/reports/*.html
