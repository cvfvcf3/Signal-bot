name: Exchange connectivity test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check exchange APIs
        run: |
          t() { code=$(curl -s -m 15 -o /tmp/r.txt -w "%{http_code}" "$2"); echo "== $1: HTTP $code"; head -c 150 /tmp/r.txt; echo; }
          t "Binance futures" "https://fapi.binance.com/fapi/v1/ticker/bookTicker?symbol=ETHUSDT"
          t "OKX taker volume" "https://www.okx.com/api/v5/rubik/stat/taker-volume-contract?instId=ETH-USDT-SWAP&period=5m"
          t "OKX order book" "https://www.okx.com/api/v5/market/books?instId=ETH-USDT-SWAP&sz=5"
          t "MEXC futures depth" "https://contract.mexc.com/api/v1/contract/depth/ETH_USDT?limit=5"
          t "Bybit" "https://api.bybit.com/v5/market/orderbook?category=linear&symbol=ETHUSDT&limit=5"
          t "Gate futures" "https://api.gateio.ws/api/v4/futures/usdt/order_book?contract=ETH_USDT&limit=5"
          curl -s -m 10 https://ipinfo.io/json | head -c 250
